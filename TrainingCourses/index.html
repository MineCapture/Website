<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Training Builder</title>
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <header class="topbar">
    <div>
      <h1>Training Builder</h1>
      <p class="muted">Build modular self-paced training and assessments without editing code.</p>
    </div>
    <div class="top-actions">
      <button id="newCourseBtn" class="secondary">New course</button>
      <button id="saveBtn">Save</button>
      <button id="exportBtn" class="secondary">Export JSON</button>
      <label class="button secondary file-button">Import JSON<input id="importInput" type="file" accept="application/json,.json" hidden></label>
      <button id="previewBtn" class="accent">Preview as trainee</button>
    </div>
  </header>

  <main>
    <section id="builderView" class="view active">
      <div class="builder-grid">
        <aside class="panel course-panel">
          <div class="panel-heading">
            <h2>Course</h2>
            <select id="courseSelect" title="Saved courses"></select>
          </div>
          <label>Title<input id="courseTitle" type="text" /></label>
          <label>Description<textarea id="courseDescription" rows="3"></textarea></label>
          <div class="row-2">
            <label>Version<input id="courseVersion" type="text" /></label>
            <label>Default pass mark<input id="coursePassMark" type="number" min="0" max="100" /></label>
          </div>

          <div class="section-title-row"><h3>Modules</h3><button id="addModuleBtn" class="small">+ Add</button></div>
          <div id="moduleList" class="sortable-list"></div>
        </aside>

        <section class="panel editor-panel">
          <div id="emptyEditor" class="empty-state">Select a module to edit it.</div>
          <div id="moduleEditor" hidden>
            <div class="editor-toolbar">
              <div>
                <div class="eyebrow">Module</div>
                <h2 id="moduleHeading">Module</h2>
              </div>
              <button id="deleteModuleBtn" class="danger secondary">Delete module</button>
            </div>

            <label>Module title<input id="moduleTitle" type="text" /></label>
            <label>Description<textarea id="moduleDescription" rows="2"></textarea></label>

            <div class="section-title-row"><h3>Steps</h3><button id="addStepBtn" class="small">+ Add step</button></div>
            <div id="stepList" class="sortable-list"></div>

            <div id="stepEditor" class="subpanel" hidden></div>

            <div class="section-title-row assessment-heading">
              <div><h3>Assessment</h3><p class="muted">Learners must pass this before the next module unlocks.</p></div>
              <button id="addQuestionBtn" class="small">+ Add question</button>
            </div>
            <div class="row-2 compact-row">
              <label>Pass mark %<input id="assessmentPassMark" type="number" min="0" max="100"></label>
              <label>Retry rule<select id="assessmentRetry"><option value="unlimited">Unlimited retries</option><option value="review">Review module before retry</option></select></label>
            </div>
            <div id="questionList" class="question-list"></div>
          </div>
        </section>
      </div>
    </section>

    <section id="playerView" class="view">
      <div class="player-shell">
        <aside class="player-sidebar">
          <button id="exitPreviewBtn" class="secondary full">← Exit preview</button>
          <div class="player-course-title" id="playerCourseTitle"></div>
          <div id="playerModuleNav"></div>
        </aside>
        <section class="player-main">
          <div id="playerContent"></div>
        </section>
      </div>
    </section>
  </main>

  <div id="toast" class="toast" aria-live="polite"></div>
  <script src="app.js"></script>
</body>
</html>
