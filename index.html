<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>MineCapture Login</title>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="/supabase-config.js"></script>

  <style>
    body {
      font-family: Arial, sans-serif;
      margin: 0;
      background: #f3f4f6;
      color: #111827;
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
    }

    .login-card {
      width: 100%;
      max-width: 420px;
      background: white;
      border-radius: 12px;
      padding: 24px;
      box-shadow: 0 8px 24px rgba(0,0,0,0.12);
    }

    h1 {
      margin-top: 0;
      margin-bottom: 8px;
      font-size: 24px;
    }

    .subtitle {
      color: #6b7280;
      margin-bottom: 24px;
    }

    label {
      display: block;
      font-weight: bold;
      margin-top: 14px;
      margin-bottom: 6px;
    }

    input {
      width: 100%;
      padding: 10px;
      box-sizing: border-box;
      border: 1px solid #d1d5db;
      border-radius: 6px;
      font-size: 15px;
    }

    button {
      width: 100%;
      margin-top: 20px;
      padding: 12px;
      border: none;
      border-radius: 6px;
      background: #1f2937;
      color: white;
      font-size: 16px;
      cursor: pointer;
    }

    button:hover {
      background: #111827;
    }

    .message {
      margin-top: 14px;
      font-size: 14px;
    }

    .error {
      color: #b91c1c;
    }

    .success {
      color: #047857;
    }

    .download-panel {
    margin-top: 24px;
    padding: 20px;
    border: 1px solid #d1d5db;
    border-radius: 10px;
    background: #ffffff;
  }

  .download-panel h2 {
    margin-top: 0;
  }

  .download-panel label {
    display: block;
    margin-bottom: 6px;
    font-weight: bold;
  }

  .download-panel select,
  .download-panel button {
    width: 100%;
    max-width: 420px;
    padding: 10px;
    margin-bottom: 12px;
    box-sizing: border-box;
  }

  .release-details {
    margin: 12px 0;
    color: #374151;
    line-height: 1.4;
  }

  #appDownloadMessage {
    color: #6b7280;
  }

  </style>
</head>

<body>


  <!-- APP DOWNLOAD -->
  <section id="appDownloadPanel" class="download-panel">
    <h2>Download MineCapture Apps</h2>

    <label for="appReleaseSelect">Select app</label>
    <select id="appReleaseSelect">
      <option value="">Loading apps...</option>
    </select>

    <div id="selectedReleaseDetails" class="release-details"></div>

    <button id="downloadApkButton" type="button" disabled>
      Download APK
    </button>

    <p id="appDownloadMessage"></p>
  </section>

  <script>

    const SUPABASE_CONFIG = window.MINECAPTURE_SUPABASE || {};
    const SUPABASE_URL = SUPABASE_CONFIG.url || "";
    const SUPABASE_KEY = SUPABASE_CONFIG.publishableKey || "";

    const supabaseClient = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

  

    // PUBLIC APP DOWNLOAD - GITHUB RELEASE LINKS ONLY
    let appReleases = [];

    document.addEventListener("DOMContentLoaded", async () => {
      setupAppDownloadEvents();
      await loadAppReleases();
    });

    async function loadAppReleases() {
      const select = document.getElementById("appReleaseSelect");
      const details = document.getElementById("selectedReleaseDetails");
      const button = document.getElementById("downloadApkButton");
      const message = document.getElementById("appDownloadMessage");

      select.innerHTML = `<option value="">Loading apps...</option>`;
      details.innerHTML = "";
      button.disabled = true;
      message.textContent = "";

      const { data, error } = await supabaseClient
        .from("APP_Releases")
        .select(`
          ReleaseID,
          AppKey,
          AppName,
          Version,
          GithubDownloadUrl,
          ReleaseNotes,
          IsLatest,
          CreatedAt
        `)
        .eq("IsActive", true)
        .eq("IsLatest", true)
        .order("AppName", { ascending: true });

      if (error) {
        console.error("Error loading app releases:", error);
        select.innerHTML = `<option value="">Could not load apps</option>`;
        message.textContent = "Could not load app releases: " + error.message;
        return;
      }

      appReleases = data || [];

      if (appReleases.length === 0) {
        select.innerHTML = `<option value="">No apps available</option>`;
        message.textContent = "No active latest releases are available.";
        return;
      }

      select.innerHTML = `<option value="">Select an app...</option>`;

      appReleases.forEach(release => {
        const option = document.createElement("option");
        option.value = release.ReleaseID;
        option.textContent = `${release.AppName} v${release.Version}`;
        select.appendChild(option);
      });
    }

    function setupAppDownloadEvents() {
      const select = document.getElementById("appReleaseSelect");
      const button = document.getElementById("downloadApkButton");
      const details = document.getElementById("selectedReleaseDetails");
      const message = document.getElementById("appDownloadMessage");

      select.addEventListener("change", () => {
        const releaseID = select.value;
        const release = appReleases.find(r => String(r.ReleaseID) === String(releaseID));

        message.textContent = "";

        if (!release) {
          details.innerHTML = "";
          button.disabled = true;
          return;
        }

        details.innerHTML = `
          <strong>${escapeHtml(release.AppName)}</strong><br>
          Version: ${escapeHtml(release.Version)}<br>
          ${release.ReleaseNotes ? `<br>${escapeHtml(release.ReleaseNotes)}` : ""}
        `;

        button.disabled = !release.GithubDownloadUrl;

        if (!release.GithubDownloadUrl) {
          message.textContent = "No GitHub download URL has been configured for this app.";
        }
      });

      button.addEventListener("click", downloadSelectedApk);
    }

    function downloadSelectedApk() {
      const select = document.getElementById("appReleaseSelect");
      const message = document.getElementById("appDownloadMessage");

      const releaseID = select.value;
      const release = appReleases.find(r => String(r.ReleaseID) === String(releaseID));

      if (!release) {
        message.textContent = "Select an app first.";
        return;
      }

      if (!release.GithubDownloadUrl) {
        message.textContent = "No GitHub download URL has been configured for this app.";
        return;
      }

      window.location.href = release.GithubDownloadUrl;
    }

    function escapeHtml(value) {
      return String(value ?? "")
        .replaceAll("&", "&amp;")
        .replaceAll("<", "&lt;")
        .replaceAll(">", "&gt;")
        .replaceAll('"', "&quot;")
        .replaceAll("'", "&#039;");
    }

    checkExistingSession();
  </script>
</body>
</html>
