<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Mine Production Dashboard</title>
<style>
  :root {
    --bg: #f4f6f8;
    --card: #ffffff;
    --border: #d9e0e6;
    --text: #1f2933;
    --muted: #6b7280;
    --accent: #2563eb;
    --accent-dark: #1d4ed8;
    --good: #15803d;
    --warn: #b45309;
    --bad: #b91c1c;
    --shadow: 0 4px 14px rgba(0,0,0,0.08);
    --radius: 12px;
  }

  * { box-sizing: border-box; }

  body {
    margin: 0;
    font-family: Arial, sans-serif;
    background: var(--bg);
    color: var(--text);
  }

  .page {
    max-width: 1700px;
    margin: 0 auto;
    padding: 20px;
  }

  .header {
    display: flex;
    flex-wrap: wrap;
    justify-content: space-between;
    align-items: center;
    gap: 16px;
    margin-bottom: 20px;
  }

  .header h1 {
    margin: 0;
    font-size: 1.8rem;
  }

  .toolbar {
    display: flex;
    flex-wrap: wrap;
    gap: 10px;
    align-items: center;
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    padding: 12px;
    box-shadow: var(--shadow);
    margin-bottom: 20px;
  }

  .toolbar input,
  .toolbar select,
  .toolbar button {
    height: 40px;
    padding: 0 12px;
    border: 1px solid var(--border);
    border-radius: 8px;
    font-size: 0.95rem;
  }

  .toolbar input {
    min-width: 220px;
    flex: 1 1 220px;
  }

  .toolbar button {
    background: var(--accent);
    color: white;
    border: none;
    cursor: pointer;
  }

  .toolbar button:hover {
    background: var(--accent-dark);
  }

  .status-row {
    display: flex;
    flex-wrap: wrap;
    gap: 16px;
    align-items: center;
    margin-bottom: 20px;
    color: var(--muted);
    font-size: 0.95rem;
  }

  .summary-badge {
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: 999px;
    padding: 8px 14px;
    box-shadow: var(--shadow);
    color: var(--text);
  }

  .section-card {
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    box-shadow: var(--shadow);
    padding: 16px;
    margin-bottom: 24px;
  }

  .section-title {
    font-size: 1.25rem;
    font-weight: bold;
    margin-bottom: 14px;
  }

  .panel-section {
    margin-bottom: 28px;
  }

  .panel-title {
    font-size: 1.25rem;
    font-weight: bold;
    margin-bottom: 12px;
    padding-bottom: 8px;
    border-bottom: 2px solid var(--border);
  }

  .heading-grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(360px, 1fr));
    gap: 16px;
  }

  .photo-card {
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    overflow: hidden;
    box-shadow: var(--shadow);
    display: flex;
    flex-direction: column;
  }

  .photo-card-image-wrap {
    position: relative;
    background: #e5e7eb;
    aspect-ratio: 4 / 3;
    overflow: hidden;
  }

  .photo-card img {
    width: 100%;
    height: 100%;
    object-fit: cover;
    cursor: pointer;
    display: block;
  }

  .image-unavailable {
    display: flex;
    align-items: center;
    justify-content: center;
    height: 100%;
    color: var(--muted);
    font-size: 0.95rem;
    padding: 20px;
    text-align: center;
  }

  .photo-card-body {
    padding: 12px;
  }

  .photo-card-heading {
    font-size: 1rem;
    font-weight: bold;
    margin-bottom: 8px;
  }

  .photo-meta {
    display: grid;
    gap: 6px;
    font-size: 0.9rem;
    color: var(--muted);
  }

  .badge-row {
    display: flex;
    flex-wrap: wrap;
    gap: 8px;
    margin-bottom: 10px;
  }

  .badge {
    display: inline-block;
    padding: 5px 10px;
    border-radius: 999px;
    font-size: 0.8rem;
    font-weight: bold;
    background: #eef2f7;
    color: var(--text);
  }

  .badge.rating-good { background: #dcfce7; color: var(--good); }
  .badge.rating-warn { background: #fef3c7; color: var(--warn); }
  .badge.rating-bad  { background: #fee2e2; color: var(--bad); }
  .badge.map-yes { background: #dbeafe; color: #1d4ed8; }
  .badge.map-no { background: #f3f4f6; color: #6b7280; }
  .badge.subphoto-yes { background: #ede9fe; color: #6d28d9; }


  .toggle-row {
    display: flex;
    gap: 8px;
    margin-bottom: 10px;
  }

  .toggle-btn {
    height: 32px;
    padding: 0 10px;
    border: 1px solid var(--border);
    border-radius: 8px;
    background: #fff;
    cursor: pointer;
    font-size: 0.85rem;
  }

  .toggle-btn.active {
    background: var(--accent);
    color: white;
    border-color: var(--accent);
  }

  .toggle-btn:disabled {
    opacity: 0.45;
    cursor: not-allowed;
  }

  .domain-inline-list {
    display: grid;
    gap: 6px;
    margin-top: 10px;
    font-size: 0.88rem;
    color: var(--text);
  }

  .domain-inline-item {
    display: flex;
    align-items: center;
    gap: 8px;
  }

  .domain-dot {
    width: 10px;
    height: 10px;
    border-radius: 999px;
    display: inline-block;
    flex: 0 0 10px;
  }

  .grade-row {
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    gap: 8px;
    margin: 10px 0 8px 0;
  }

  .grade-box {
    border: 1px solid var(--border);
    border-radius: 10px;
    padding: 10px;
    background: #f8fafc;
  }

  .grade-label {
    font-size: 0.78rem;
    color: var(--muted);
    margin-bottom: 4px;
  }

  .grade-value {
  font-size: 1.05rem;
  font-weight: bold;
}

.grade-value.grade-good {
  color: var(--good);
}

.grade-value.grade-warn {
  color: var(--warn);
}

.grade-value.grade-bad {
  color: var(--bad);
}

.grade-value:not(.grade-good):not(.grade-warn):not(.grade-bad) {
  color: var(--text);
}

  .submap-note {
    margin-top: 8px;
    font-size: 0.84rem;
    color: var(--muted);
  }

  .empty-message,
  .error-message,
  .loading-message {
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    padding: 20px;
    box-shadow: var(--shadow);
  }

  table {
    width: 100%;
    border-collapse: collapse;
    background: white;
    border: 1px solid var(--border);
    border-radius: 12px;
    overflow: hidden;
  }

  th, td {
    text-align: left;
    padding: 10px;
    border-top: 1px solid var(--border);
    font-size: 0.95rem;
    vertical-align: top;
  }

  thead th {
    background: #eef2f7;
    border-top: none;
  }

  .small-muted {
    color: var(--muted);
    font-size: 0.85rem;
  }

    #modal {
    display: none;
    position: fixed;
    inset: 0;
    background: rgba(0,0,0,0.82);
    z-index: 1000;
    padding: 20px;
    align-items: center;
    justify-content: center;
    overflow: auto;
  }

.modal-content {
  max-width: 98vw;
  max-height: 98vh;
  width: 1500px;
  background: #111827;
  border-radius: 14px;
  overflow: hidden;
  display: grid;
  grid-template-columns: minmax(0, 1fr) 240px;
}

  .modal-image-wrap {
    background: black;
    display: flex;
    align-items: center;
    justify-content: center;
    min-height: 400px;
    min-width: 0;
    overflow: auto;
  }

  .modal-image-wrap img {
    max-width: 100%;
    max-height: 95vh;
    display: block;
  }


  .modal-image-wrap {
  position: relative;
  cursor: default;
}

.modal-image-wrap img {
  transition: transform 0.08s ease-out;
  transform-origin: center center;
  user-select: none;
  -webkit-user-drag: none;
  touch-action: none;
}

  .modal-side {
    background: #f9fafb;
    color: var(--text);
    padding: 18px;
    overflow-y: auto;
    max-height: 95vh;
  }

  .modal-side h2 {
    margin-top: 0;
    margin-bottom: 14px;
    font-size: 1.2rem;
  }

  .modal-meta {
    display: grid;
    gap: 10px;
    font-size: 0.95rem;
  }

  .modal-meta div {
    padding-bottom: 8px;
    border-bottom: 1px solid #e5e7eb;
  }

  .modal-toggle-row {
    display: flex;
    gap: 8px;
    margin-bottom: 14px;
  }

  .close-btn {
    margin-top: 18px;
    width: 100%;
    height: 42px;
    border: none;
    border-radius: 8px;
    background: var(--accent);
    color: white;
    cursor: pointer;
    font-size: 0.95rem;
  }

  .close-btn:hover {
    background: var(--accent-dark);
  }

  @media (max-width: 980px) {
    .modal-content {
      grid-template-columns: 1fr;
      width: 100%;
      max-height: 95vh;
    }

    .modal-image-wrap {
      max-height: 55vh;
    }

    .modal-side {
      max-height: 40vh;
    }
  }


  /* =========================================================
   PANEL SEQUENCE PLAN
========================================================= */

.panel-production-grid {
  display: grid;
  grid-template-columns: minmax(0, 1.4fr) minmax(320px, 0.8fr);
  gap: 16px;
  margin-bottom: 16px;
}

.sequence-dashboard-card,
.production-summary-card,
.face-evidence-section {
  background: var(--card);
  border: 1px solid var(--border);
  border-radius: var(--radius);
  box-shadow: var(--shadow);
  padding: 14px;
}

.sequence-dashboard-title,
.production-summary-title,
.face-evidence-title {
  font-size: 1rem;
  font-weight: bold;
  margin-bottom: 10px;
}

.sequence-plan-dashboard-wrap {
  position: relative;
  width: 100%;
  height: clamp(260px, 36vw, 540px);
  background: #ffffff;
  border: 1px solid var(--border);
  border-radius: 10px;
  overflow: hidden;
}

.sequence-plan-dashboard-img {
  width: 100%;
  height: 100%;
  object-fit: contain;
  display: block;
}

.sequence-plan-dashboard-marker-layer {
  position: absolute;
  inset: 0;
  width: 100%;
  height: 100%;
  pointer-events: none;
  z-index: 5;
}

.sequence-plan-dashboard-marker {
  position: absolute;
  transform: translate(-50%, -50%);
  min-width: 2rem;
  height: 2rem;
  padding: 0 0.45rem;
  border-radius: 999px;
  background: #ffffff;
  border: 0.18rem solid #111111;
  color: #111111;
  font-weight: 800;
  font-size: 0.9rem;
  display: grid;
  place-items: center;
  pointer-events: auto;
  cursor: pointer;
  user-select: none;
  z-index: 10;
}

.sequence-plan-dashboard-marker[data-pattern="dots"] {
  background-image:
    radial-gradient(circle, rgba(0,0,0,.25) 12%, transparent 13%);
  background-size: 6px 6px;
}

.sequence-plan-dashboard-marker[data-pattern="hex"] {
  background-image:
    repeating-linear-gradient(
      60deg,
      rgba(0,0,0,.12),
      rgba(0,0,0,.12) 2px,
      transparent 2px,
      transparent 8px
    );
}

.sequence-plan-dashboard-tooltip {
  position: absolute;
  z-index: 20;
  min-width: 13rem;
  max-width: min(20rem, 80vw);
  padding: 0.7rem;
  border-radius: 0.5rem;
  background: #111827;
  color: #ffffff;
  border: 1px solid rgba(255,255,255,0.3);
  box-shadow: 0 8px 22px rgba(0,0,0,0.28);
  font-size: 0.88rem;
}

.sequence-plan-dashboard-tooltip.hidden {
  display: none !important;
}

.sequence-tooltip-title {
  font-weight: 800;
  margin-bottom: 0.3rem;
}

.sequence-tooltip-line {
  margin-top: 0.22rem;
}

/* =========================================================
   PRODUCTION / SEQUENCE DETAIL SUMMARY
========================================================= */

.production-summary-list {
  display: grid;
  gap: 8px;
  max-height: 540px;
  overflow-y: auto;
  padding-right: 4px;
}

.production-summary-row {
  border: 1px solid var(--border);
  border-radius: 10px;
  padding: 10px;
  background: #f8fafc;
}

.production-summary-row-title {
  font-weight: bold;
  margin-bottom: 6px;
  color: var(--text);
}

.production-summary-meta {
  display: grid;
  gap: 4px;
  color: var(--muted);
  font-size: 0.88rem;
}

.production-summary-meta strong {
  color: var(--text);
}

.production-status-badge {
  display: inline-block;
  padding: 3px 8px;
  border-radius: 999px;
  font-size: 0.78rem;
  font-weight: bold;
  background: #eef2f7;
  color: var(--text);
}

/* Keeps the sequence detail card readable beside the plan image */
.production-summary-card {
  min-height: 0;
  max-height: clamp(260px, 36vw, 540px);
  overflow: hidden;
  display: flex;
  flex-direction: column;
}

.production-summary-card .production-summary-list {
  flex: 1;
}

.dashboard-drill-hole-list {
  display: grid;
  gap: 4px;
  margin-top: 4px;
}

.dashboard-drill-hole-row {
  padding: 4px 6px;
  border: 1px solid var(--border);
  border-radius: 6px;
  background: #eef2f7;
  color: var(--text);
  font-size: 0.85rem;
}

</style>
</head>
<body>

<div class="page">
  <div class="header">
    <h1>Mine Production Dashboard</h1>
  </div>

  <div class="toolbar">
    <input type="text" id="searchInput" placeholder="Search panel, heading, rating or chainage">
    <select id="sortSelect">
      <option value="panel-heading">Sort: Panel / Heading</option>
      <option value="newest-photo">Sort: Newest photo first</option>
      <option value="newest-map">Sort: Newest map first</option>
      <option value="oldest-photo">Sort: Oldest photo first</option>
      <option value="rating">Sort: Rating</option>
      <option value="k2o-desc">Sort: K2O high to low</option>
      <option value="halite-desc">Sort: Halite high to low</option>
      <option value="cl-desc">Sort: Cl high to low</option>
    </select>
    <select id="mapFilterSelect">
      <option value="all">Show: All</option>
      <option value="mapped">Show: Mapped only</option>
      <option value="unmapped">Show: Unmapped only</option>
    </select>
    <button id="refreshBtn">Refresh</button>
  </div>

  <div class="status-row">
    <div class="summary-badge" id="photoCount">Headings shown: 0</div>
    <div class="summary-badge" id="mappedCount">Mapped: 0</div>
    <div class="summary-badge" id="panelCount">Panels: 0</div>
    <div class="summary-badge" id="lastUpdated">Last updated: --</div>
  </div>

  <div class="section-card">
    <div class="section-title">Mining Plan</div>

    <div class="toolbar" style="margin-bottom:16px;">
      <select id="planHeadingSelect">
        <option value="">Select heading</option>
      </select>
      <input type="number" id="planTonnageInput" placeholder="Planned tonnes" min="0" step="0.1">
      <button id="addPlanBtn">Add to plan</button>
    </div>

    <div id="planTableWrap" class="empty-message">No planned headings added.</div>

    <div class="status-row" style="margin-top:16px; margin-bottom:0;">
      <div class="summary-badge" id="planTotalTonnes">Total tonnes: 0.0</div>
      <div class="summary-badge" id="planWeightedK2O">Weighted K2O: 0.0%</div>
      <div class="summary-badge" id="planWeightedHalite">Weighted Halite: 0.0%</div>
      <div class="summary-badge" id="planWeightedCl">Weighted Cl: 0.0%</div>
    </div>
  </div>

  <div id="dashboard" class="loading-message">Loading photos...</div>
</div>

<div id="modal">
  <div class="modal-content">
    <div class="modal-image-wrap">
      <img id="modal-img" src="" alt="">
    </div>
    <div class="modal-side">
      <h2 id="modal-title">Face Photo</h2>

      <div class="modal-toggle-row">
        <button id="modalPhotoBtn" class="toggle-btn active">Photo</button>
        <button id="modalMapBtn" class="toggle-btn">Map</button>
        <button id="modalSectionBtn" class="toggle-btn">Section</button>
      </div>

      <div class="modal-meta" id="modal-meta"></div>
      <button class="modal-close-btn" id="closeModalBtn">×</button>
    </div>
  </div>
</div>

<script>
const SUPABASE_CONFIG = window.MINECAPTURE_SUPABASE || {};
const SUPABASE_URL = SUPABASE_CONFIG.url || "";
const SUPABASE_KEY = SUPABASE_CONFIG.publishableKey || "";
const STORAGE_BASE = `${SUPABASE_URL}/storage/v1/object/public/`;

let dashboardRows = [];
let sequenceRows = [];
let miningPlan = [];

let currentModalRow = null;
let currentModalMode = "photo";

let modalZoom = 1;
let modalPanX = 0;
let modalPanY = 0;
let modalDragging = false;
let modalDragStartX = 0;
let modalDragStartY = 0;

// Grade colour schemes
function getK2OClass(value) {
  const v = Number(value);
  if (!isFinite(v)) return "";

  if (v >= 13.8) return "grade-good";
  if (v >= 13.5) return "grade-warn";
  return "grade-bad";
}

function getClClass(value) {
  const v = Number(value);
  if (!isFinite(v)) return "";

  if (v <= 4.5) return "grade-good";
  if (v <= 6.0) return "grade-warn";
  return "grade-bad";
}

function formatDateTime(value) {
  if (!value) return "No timestamp";
  const d = new Date(value);
  return isNaN(d.getTime()) ? value : d.toLocaleString();
}

function formatPercent(value, decimals = 1) {
  const num = Number(value);
  return Number.isFinite(num) ? `${num.toFixed(decimals)}%` : "N/A";
}

function formatNumber(value, decimals = 1) {
  const num = Number(value);
  return Number.isFinite(num) ? num.toFixed(decimals) : "N/A";
}

function getRatingClass(rating) {
  const val = (rating || "").toLowerCase();
  if (["good", "high", "fresh", "strong"].includes(val)) return "rating-good";
  if (["fair", "medium", "watch"].includes(val)) return "rating-warn";
  if (["poor", "bad", "low"].includes(val)) return "rating-bad";
  return "";
}

function safeText(value) {
  return value ?? "";
}

function getPublicStorageUrl(path) {
  if (!path) return "";
  const trimmed = String(path).trim();
  return STORAGE_BASE + trimmed;
}

function sanitisePathPart(value) {
  return String(value || "")
    .trim()
    .replace(/[\\/:"*?<>|]+/g, "_");
}

function getSectionObjectPath(row) {
  const panel = sanitisePathPart(row.panel);
  const heading = sanitisePathPart(row.heading);
  return `MineSections/${panel}_${heading}_section.jpg`;
}

function getSectionUrl(row) {
  return getPublicStorageUrl(getSectionObjectPath(row));
}
function normaliseDomainSummary(value) {
  if (Array.isArray(value)) return value;
  if (!value) return [];
  try {
    return JSON.parse(value);
  } catch {
    return [];
  }
}

function renderDomainSummaryInline(domainSummary) {
  const items = normaliseDomainSummary(domainSummary)
    .filter(d => d && d.domainName && d.percent != null);

  if (!items.length) {
    return '<div class="small-muted">No mapped domains</div>';
  }

  return `
    <div class="domain-inline-list">
      ${items.map(d => `
        <div class="domain-inline-item">
          <span class="domain-dot" style="background:${d.colour || "#999"}"></span>
          <span>${d.domainName} - ${Number(d.percent).toFixed(1)}%</span>
        </div>
      `).join("")}
    </div>
  `;
}

function getHeadingGrades(row) {
  return {
    k2o: Number(row.estK2O || 0),
    halite: Number(row.estHalite || 0),
    cl: Number(row.estCl || 0),
    mappedPercent: Number(row.mappedPercent || 0)
  };
}


async function fetchSequenceDashboardRows() {
  const url = `${SUPABASE_URL}/rest/v1/rpc/get_panel_sequence_dashboard`;

  const res = await fetch(url, {
    method: "POST",
    headers: {
      "apikey": SUPABASE_KEY,
      "Authorization": `Bearer ${SUPABASE_KEY}`,
      "Content-Type": "application/json"
    }
  });

  if (!res.ok) {
    const errText = await res.text();
    throw new Error(`Sequence RPC HTTP ${res.status}: ${errText}`);
  }

  const rows = await res.json();

  return Array.isArray(rows) ? rows : [];
}

function buildPanelDashboardModel(faceRows, seqRows) {
  const panels = {};

  function ensurePanel(panelName) {
    const key = panelName || "Unknown Panel";

    if (!panels[key]) {
      panels[key] = {
        panel: key,
        faceRows: [],
        sequenceRows: []
      };
    }

    return panels[key];
  }

  faceRows.forEach(row => {
    ensurePanel(row.panel).faceRows.push(row);
  });

  seqRows.forEach(row => {
    ensurePanel(row.panel).sequenceRows.push(row);
  });

  return panels;
}

function getStorageOrDirectUrl(path) {
  if (!path) return "";

  const trimmed = String(path).trim();

  if (trimmed.startsWith("http://") || trimmed.startsWith("https://")) {
    return trimmed;
  }

  return getPublicStorageUrl(trimmed);
}

function groupByValue(rows, keyFn) {
  const map = new Map();

  rows.forEach(row => {
    const key = keyFn(row);

    if (!map.has(key)) {
      map.set(key, []);
    }

    map.get(key).push(row);
  });

  return map;
}

function getContainedImageBoxForDashboard(img) {
  const wrap = img.parentElement;

  const containerWidth = wrap.clientWidth;
  const containerHeight = wrap.clientHeight;

  const naturalWidth = img.naturalWidth;
  const naturalHeight = img.naturalHeight;

  if (!containerWidth || !containerHeight || !naturalWidth || !naturalHeight) {
    return {
      left: 0,
      top: 0,
      width: containerWidth,
      height: containerHeight
    };
  }

  const scale = Math.min(
    containerWidth / naturalWidth,
    containerHeight / naturalHeight
  );

  const width = naturalWidth * scale;
  const height = naturalHeight * scale;

  return {
    left: (containerWidth - width) / 2,
    top: (containerHeight - height) / 2,
    width,
    height
  };
}

function applyDashboardSequenceMarkerStyle(marker, row) {
  marker.style.background =
    row.markerFill && row.markerFill !== "transparent"
      ? row.markerFill
      : "#FFFFFF";

  marker.style.borderColor = row.markerStroke || "#111111";
  marker.style.color = "#111111";
  marker.style.opacity = row.markerOpacity ?? 1;
  marker.style.borderWidth = `${row.markerBorderWidth || 0.18}rem`;
  marker.dataset.pattern = row.markerPattern || "";
  marker.title = row.currentStatus || "NotStarted";
}

function formatDistanceRange(row) {
  return `${formatNumber(row.fromDistance, 1)}m → ${formatNumber(row.toDistance, 1)}m`;
}

function formatOutputSummary(row) {
  const parts = [];

  if (row.latestTonnes != null) {
    parts.push(`${formatNumber(row.latestTonnes, 1)}t`);
  }

  if (row.latestFacePosition != null) {
    parts.push(`Face ${formatNumber(row.latestFacePosition, 1)}m`);
  }

  if (row.latestRowsSet != null) {
    parts.push(`${formatNumber(row.latestRowsSet, 1)} rows`);
  }

  const drillHolesHtml = formatDashboardDrillingHoles(row);

  if (drillHolesHtml) {
    parts.push(drillHolesHtml);
  } else if (row.latestHoleDepth != null || row.latestHoleAngle != null) {
    const drillingParts = [];

    if (row.latestHoleDepth != null) {
      drillingParts.push(`${formatNumber(row.latestHoleDepth, 1)}m`);
    }

    if (row.latestHoleAngle != null) {
      drillingParts.push(`${formatNumber(row.latestHoleAngle, 1)}°`);
    }

    if (drillingParts.length) {
      parts.push(drillingParts.join(" @ "));
    }
  }

  return parts.length ? parts.join("<br>") : "No output recorded";
}


function getCurrentSequenceRowsForPanel(sequenceRowsForPanel) {
  const byHeading = groupByValue(
    sequenceRowsForPanel,
    row => `${row.headingID || row.heading || "unknown"}`
  );

  const currentRows = [];

  for (const [, headingRows] of byHeading.entries()) {
    const ordered = [...headingRows]
      .sort((a, b) => Number(a.sequenceNo || 0) - Number(b.sequenceNo || 0));

    const firstIncomplete = ordered.find(row => !row.isCompleteStatus);

    if (firstIncomplete) {
      currentRows.push(firstIncomplete);
    } else if (ordered.length) {
      currentRows.push(ordered[ordered.length - 1]);
    }
  }

  return currentRows.sort((a, b) =>
    String(a.heading || "").localeCompare(String(b.heading || ""))
  );
}

function getSequenceDetailRowsForPanel(sequenceRowsForPanel) {
  return [...(sequenceRowsForPanel || [])]
    .sort((a, b) => {
      const seqCompare = Number(b.sequenceNo || 0) - Number(a.sequenceNo || 0);
      if (seqCompare !== 0) return seqCompare;

      return String(a.heading || "").localeCompare(String(b.heading || ""));
    });
}

function renderPanelSequencePlans(panelData) {

  title.className = "sequence-dashboard-title";
  title.textContent = "Sequence Plan";

  card.appendChild(title);

  if (!sequenceRowsForPanel.length) {
    const empty = document.createElement("div");
    empty.className = "small-muted";
    empty.textContent = "No sequence data found for this panel.";
    card.appendChild(empty);
    return card;
  }

  const plans = groupByValue(
    sequenceRowsForPanel,
    row => `${row.seqPlanID || "no-plan"}`
  );

  for (const [, planRows] of plans.entries()) {
    const first = planRows[0];

    const planTitle = document.createElement("div");
    planTitle.className = "small-muted";
    planTitle.style.marginBottom = "8px";
    planTitle.textContent = first.planName || `Plan ${first.seqPlanID || ""}`;
    card.appendChild(planTitle);

    wrap.className = "sequence-plan-dashboard-wrap";

    img.className = "sequence-plan-dashboard-img";
    img.alt = first.planName || "Sequence plan";

    markerLayer.className = "sequence-plan-dashboard-marker-layer";

    const tooltip = document.createElement("div");
    tooltip.className = "sequence-plan-dashboard-tooltip hidden";

    wrap.appendChild(img);
    wrap.appendChild(markerLayer);
    wrap.appendChild(tooltip);

    const renderMarkers = () => {
      requestAnimationFrame(() => {
        requestAnimationFrame(() => {
          renderDashboardSequenceMarkers(wrap, img, markerLayer, tooltip, planRows);
        });
      });
    };

    img.onload = renderMarkers;

    img.onerror = () => {
      wrap.innerHTML = '<div class="image-unavailable">Sequence plan image unavailable</div>';
    };

    img.src = getStorageOrDirectUrl(first.imagePath);

    // If browser cache loads the image before onload is observed, force marker render.
    if (img.complete && img.naturalWidth > 0) {

    }

    card.appendChild(wrap);
  }

  return card;

function renderDashboardSequenceMarkers(wrap, img, markerLayer, tooltip, planRows) {
  markerLayer.innerHTML = "";

  if (!img.naturalWidth || !img.naturalHeight) {
    console.warn("[SequenceDashboard] Cannot render markers because image size is unavailable.");
    return;
  }

  const displayBox = getContainedImageBoxForDashboard(img);

  const orderedRows = [...planRows]
    .filter(row => row.xRatio != null && row.yRatio != null)
    .sort((a, b) => Number(a.sequenceNo || 0) - Number(b.sequenceNo || 0));

  console.log(
    `[SequenceDashboard] Rendering ${orderedRows.length} markers for plan ${planRows[0]?.planName || planRows[0]?.seqPlanID}`
  );

  orderedRows.forEach(row => {
    const marker = document.createElement("button");
    marker.type = "button";
    marker.className = "sequence-plan-dashboard-marker";
    marker.textContent = row.sequenceNo ?? "";

    marker.style.left = `${displayBox.left + Number(row.xRatio) * displayBox.width}px`;
    marker.style.top = `${displayBox.top + Number(row.yRatio) * displayBox.height}px`;

    applyDashboardSequenceMarkerStyle(marker, row);

    marker.addEventListener("click", event => {
      event.stopPropagation();
      showDashboardSequenceTooltip(wrap, tooltip, marker, row);
    });

    markerLayer.appendChild(marker);
  });

  wrap.addEventListener("click", event => {
    if (event.target.closest(".sequence-plan-dashboard-marker")) return;
    tooltip.classList.add("hidden");
  });
}

    </div>

    </div>
  `;

  positionDashboardSequenceTooltip(wrap, tooltip, marker);
  tooltip.classList.remove("hidden");
}

function positionDashboardSequenceTooltip(wrap, tooltip, marker) {
  const markerRect = marker.getBoundingClientRect();
  const wrapRect = wrap.getBoundingClientRect();

  const tooltipWidth = 250;
  const tooltipHeightEstimate = 165;

  let left = markerRect.left - wrapRect.left + markerRect.width + 8;
  let top = markerRect.top - wrapRect.top - 8;

  const maxLeft = wrap.clientWidth - tooltipWidth - 8;
  const maxTop = wrap.clientHeight - tooltipHeightEstimate - 8;

  if (left > maxLeft) {
    left = markerRect.left - wrapRect.left - tooltipWidth - 8;
  }

  if (top > maxTop) {
    top = maxTop;
  }

  if (left < 8) left = 8;
  if (top < 8) top = 8;

  tooltip.style.left = `${left}px`;
  tooltip.style.top = `${top}px`;
}

function isNotStartedSequence(row) {
  const status = String(row.currentStatus || "")
    .trim()
    .toLowerCase()
    .replace(/\s+/g, "");

  return status === "" || status === "notstarted";
}

async function loadDashboard() {
  const container = document.getElementById("dashboard");
  container.className = "loading-message";
  container.textContent = "Loading dashboard...";

  try {
    const faceUrl = `${SUPABASE_URL}/rest/v1/rpc/get_active_facephotos`;

    const [faceRes, sequenceData] = await Promise.all([
      fetch(faceUrl, {
        method: "POST",
        headers: {
          "apikey": SUPABASE_KEY,
          "Authorization": `Bearer ${SUPABASE_KEY}`,
          "Content-Type": "application/json"
        }
      }),
      fetchSequenceDashboardRows()
    ]);

    if (!faceRes.ok) {
      const errText = await faceRes.text();
      throw new Error(`Face photo RPC HTTP ${faceRes.status}: ${errText}`);
    }

    const faceRows = await faceRes.json();

    dashboardRows = Array.isArray(faceRows) ? faceRows : [];
    sequenceRows = sequenceData;

    console.log("[Dashboard] Face rows:", dashboardRows.length);
    console.log("[Dashboard] Sequence rows:", sequenceRows.length);

    updateSummary(dashboardRows);
    populatePlanHeadingSelect(dashboardRows);
    applyFiltersAndRender();
    renderMiningPlan();
  } catch (err) {
    console.error("Dashboard error:", err);
    container.className = "error-message";
    container.textContent = "Failed to load dashboard.";
  }
}

function updateSummary(rows) {
  const uniquePanels = new Set(rows.map(r => r.panel).filter(Boolean));
  const mappedCount = rows.filter(r => r.has_map).length;

  document.getElementById("photoCount").textContent = `Headings shown: ${rows.length}`;
  document.getElementById("mappedCount").textContent = `Mapped: ${mappedCount}`;
  document.getElementById("panelCount").textContent = `Panels: ${uniquePanels.size}`;
  document.getElementById("lastUpdated").textContent = `Last updated: ${new Date().toLocaleTimeString()}`;
}

function applyFiltersAndRender() {
  const search = document.getElementById("searchInput").value.trim().toLowerCase();
  const sortMode = document.getElementById("sortSelect").value;
  const mapFilter = document.getElementById("mapFilterSelect").value;

  let filteredFaceRows = dashboardRows.filter(r => !r.isSubPhoto);

  if (search) {
    filteredFaceRows = filteredFaceRows.filter(r => {
      const haystack = [
        r.panel,
        r.heading,
        r.rating,
        r.chainage,
        r.facePhotoID,
        r.estK2O,
        r.estHalite,
        r.estCl
      ].join(" ").toLowerCase();

      return haystack.includes(search);
    });
  }

  if (mapFilter === "mapped") {
    filteredFaceRows = filteredFaceRows.filter(r => r.has_map);
  } else if (mapFilter === "unmapped") {
    filteredFaceRows = filteredFaceRows.filter(r => !r.has_map);
  }

  filteredFaceRows.sort((a, b) => {
    if (sortMode === "newest-photo") {
      return new Date(b.photo_timestamp || 0) - new Date(a.photo_timestamp || 0);
    }
    if (sortMode === "newest-map") {
      return new Date(b.map_timestamp || 0) - new Date(a.map_timestamp || 0);
    }
    if (sortMode === "oldest-photo") {
      return new Date(a.photo_timestamp || 0) - new Date(b.photo_timestamp || 0);
    }
    if (sortMode === "rating") {
      return String(a.rating || "").localeCompare(String(b.rating || ""));
    }
    if (sortMode === "k2o-desc") {
      return Number(b.estK2O || 0) - Number(a.estK2O || 0);
    }
    if (sortMode === "halite-desc") {
      return Number(b.estHalite || 0) - Number(a.estHalite || 0);
    }
    if (sortMode === "cl-desc") {
      return Number(b.estCl || 0) - Number(a.estCl || 0);
    }

    const panelCompare = String(a.panel || "").localeCompare(String(b.panel || ""));
    if (panelCompare !== 0) return panelCompare;

    return String(a.heading || "").localeCompare(String(b.heading || ""));
  });

  const filteredSequenceRows = sequenceRows.filter(r => {
    if (!search) return true;

    const haystack = [
      r.panel,
      r.heading,
      r.planName,
      r.sequenceNo,
      r.currentStatus,
      r.fromDistance,
      r.toDistance
    ].join(" ").toLowerCase();

    return haystack.includes(search);
  });

  const panelModel = buildPanelDashboardModel(filteredFaceRows, filteredSequenceRows);

  renderDashboard(panelModel);
}

    <div><strong>Cl:</strong> <span class="grade-value ${clClass}">${formatPercent(row.estCl, 1)}</span></div>
    <div><strong>Resolved via sub-map:</strong> ${row.resolvedViaSubMap ? "Yes" : "No"}</div>
    <div><strong>Linked sub-map count:</strong> ${Number(row.linkedSubMapCount || 0)}</div>
    <div><strong>Face Photo ID:</strong> ${safeText(row.facePhotoID)}</div>
    <div><strong>Domain summary:</strong><br>${domainHtml}</div>
  `;

  updateModalImage();
  document.getElementById("modal").style.display = "flex";
}

function closeModal() {
  document.getElementById("modal").style.display = "none";
  currentModalRow = null;
  currentModalMode = "photo";
  document.getElementById("modal-img").src = "";
  resetModalZoom();
}

function updateModalImage() {
  if (!currentModalRow) return;

  const hasMap = Boolean(currentModalRow.has_map && currentModalRow.map_url);

  let src = "";
  if (currentModalMode === "map" && hasMap) {
    src = getPublicStorageUrl(currentModalRow.map_url);
  } else if (currentModalMode === "section") {
    src = getSectionUrl(currentModalRow);
  } else {
    src = getPublicStorageUrl(currentModalRow.photo_url);
  }

  const modalImg = document.getElementById("modal-img");
  modalImg.onerror = () => {
    modalImg.src = "";
  };
  modalImg.src = src || "";

  const photoBtn = document.getElementById("modalPhotoBtn");
  const mapBtn = document.getElementById("modalMapBtn");
  const sectionBtn = document.getElementById("modalSectionBtn");

  photoBtn.classList.toggle("active", currentModalMode === "photo");
  mapBtn.classList.toggle("active", currentModalMode === "map");
  sectionBtn.classList.toggle("active", currentModalMode === "section");

  mapBtn.disabled = !hasMap;
  sectionBtn.disabled = false;

  document.getElementById("modal-title").textContent =
    `${currentModalRow.panel || ""} - ${currentModalRow.heading || ""} (${currentModalMode === "map" ? "Map" : currentModalMode === "section" ? "Section" : "Photo"})`;

  resetModalZoom();
}

function applyModalTransform() {
  const img = document.getElementById("modal-img");
  img.style.transform = `translate(${modalPanX}px, ${modalPanY}px) scale(${modalZoom})`;
  img.style.cursor = modalZoom > 1 ? (modalDragging ? "grabbing" : "grab") : "default";
}

function resetModalZoom() {
  modalZoom = 1;
  modalPanX = 0;
  modalPanY = 0;
  modalDragging = false;
  applyModalTransform();
}

function toggleModalZoom() {
  if (modalZoom === 1) {
    modalZoom = 2.5;
  } else {
    resetModalZoom();
    return;
  }
  applyModalTransform();
}

function normaliseDashboardDrillingHoles(value) {
  if (Array.isArray(value)) {
    return value;
  }

  if (!value) {
    return [];
  }

  if (typeof value === "string") {
    try {
      const parsed = JSON.parse(value);
      return Array.isArray(parsed) ? parsed : [];
    } catch {
      return [];
    }
  }

  return [];
}

function formatDrillHoleValue(value, suffix = "") {
  const num = Number(value);

  if (!Number.isFinite(num)) {
    return "N/A";
  }

  return `${num.toFixed(1)}${suffix}`;
}

function formatDashboardDrillingHoles(row) {
  const holes = normaliseDashboardDrillingHoles(row.latestDrillingHoles);

  if (!holes.length) {
    return "";
  }

  return `
    <div class="dashboard-drill-hole-list">
      ${holes.map((hole, index) => {
        const holeNo = hole.holeNo ?? index + 1;
        const depth = hole.holeDepth ?? hole.HoleDepth;
        const angle = hole.holeAngle ?? hole.HoleAngle;
        const drilledShort = hole.drilledShort ?? hole.drilledShort;

        return `
          <div class="dashboard-drill-hole-row">
            <strong>Hole ${safeText(holeNo)}:</strong>
            ${formatDrillHoleValue(depth, "m")}
            @
            ${formatDrillHoleValue(angle, "°")}
            ${drilledShort ? " — Drilling Stopped Short" : ""}
          </div>
        `;
      }).join("")}
    </div>
  `;
}


let dashboardSequenceResizeTimer = null;

window.addEventListener("resize", () => {
  clearTimeout(dashboardSequenceResizeTimer);

  dashboardSequenceResizeTimer = setTimeout(() => {
    document.querySelectorAll(".sequence-plan-dashboard-wrap").forEach(wrap => {
      const img = wrap.querySelector(".sequence-plan-dashboard-img");
      const markerLayer = wrap.querySelector(".sequence-plan-dashboard-marker-layer");
      const tooltip = wrap.querySelector(".sequence-plan-dashboard-tooltip");

      if (!img || !markerLayer || !tooltip || !wrap._sequencePlanRows) return;

      renderDashboardSequenceMarkers(wrap, img, markerLayer, tooltip, wrap._sequencePlanRows);
    });
  }, 150);
});


document.getElementById("modalPhotoBtn").addEventListener("click", () => {
  if (!currentModalRow) return;
  currentModalMode = "photo";
  updateModalImage();
});

document.getElementById("modalMapBtn").addEventListener("click", () => {
  if (!currentModalRow) return;
  if (!(currentModalRow.has_map && currentModalRow.map_url)) return;
  currentModalMode = "map";
  updateModalImage();
});

document.getElementById("modalSectionBtn").addEventListener("click", () => {
  if (!currentModalRow) return;
  currentModalMode = "section";
  updateModalImage();
});
function populatePlanHeadingSelect(rows) {
  const select = document.getElementById("planHeadingSelect");
  const currentValue = select.value;

  const candidates = rows
  .filter(r => r.has_map && !r.isSubPhoto)
    .sort((a, b) => {
      const panelCompare = String(a.panel || "").localeCompare(String(b.panel || ""));
      if (panelCompare !== 0) return panelCompare;
      return String(a.heading || "").localeCompare(String(b.heading || ""));
    });

  select.innerHTML = '<option value="">Select heading</option>';

  candidates.forEach(r => {
    const option = document.createElement("option");
    option.value = r.facePhotoID;
    option.textContent = `${r.panel} - ${r.heading} (${r.chainage ?? "N/A"}m)`;
    select.appendChild(option);
  });

  if ([...select.options].some(o => o.value === currentValue)) {
    select.value = currentValue;
  }
}

function addPlanRow() {
  const facePhotoID = document.getElementById("planHeadingSelect").value;
  const tonnage = Number(document.getElementById("planTonnageInput").value || 0);

  if (!facePhotoID || tonnage <= 0) {
    alert("Select a heading and enter planned tonnes.");
    return;
  }

  const row = dashboardRows.find(r => r.facePhotoID === facePhotoID);
  if (!row) {
    alert("Selected heading data not found.");
    return;
  }

  const grades = getHeadingGrades(row);

  const existing = miningPlan.find(x => x.facePhotoID === facePhotoID);
  if (existing) {
    existing.tonnage = tonnage;
    existing.k2o = grades.k2o;
    existing.halite = grades.halite;
    existing.cl = grades.cl;
    existing.row = row;
  } else {
    miningPlan.push({
      facePhotoID,
      tonnage,
      k2o: grades.k2o,
      halite: grades.halite,
      cl: grades.cl,
      row
    });
  }

  document.getElementById("planTonnageInput").value = "";
  renderMiningPlan();
}

function removePlanRow(facePhotoID) {
  miningPlan = miningPlan.filter(x => x.facePhotoID !== facePhotoID);
  renderMiningPlan();
}

function renderMiningPlan() {
  const wrap = document.getElementById("planTableWrap");

  const refreshedPlan = miningPlan.map(item => {
    const latestRow = dashboardRows.find(r => r.facePhotoID === item.facePhotoID) || item.row;
    const grades = getHeadingGrades(latestRow);

    return {
      ...item,
      row: latestRow,
      k2o: grades.k2o,
      halite: grades.halite,
      cl: grades.cl
    };
  });

  miningPlan = refreshedPlan;

  if (!miningPlan.length) {
    wrap.className = "empty-message";
    wrap.textContent = "No planned headings added.";
    document.getElementById("planTotalTonnes").textContent = "Total tonnes: 0.0";
    document.getElementById("planWeightedK2O").innerHTML = `Weighted K2O: <span class="grade-value">0.0%</span>`;
    document.getElementById("planWeightedHalite").innerHTML = `Weighted Halite: <span class="grade-value">0.0%</span>`;
    document.getElementById("planWeightedCl").innerHTML = `Weighted Cl: <span class="grade-value">0.0%</span>`;
    return;
  }

  wrap.className = "";

  wrap.innerHTML = `
    <table>
      <thead>
        <tr>
          <th>Panel</th>
          <th>Heading</th>
          <th>Chainage</th>
          <th>Tonnes</th>
          <th>K2O</th>
          <th>Halite</th>
          <th>Cl</th>
          <th>Mapped domains</th>
          <th>Action</th>
        </tr>
      </thead>
      <tbody>
        ${miningPlan.map(item => {
          const k2oClass = getK2OClass(item.k2o);
          const clClass = getClClass(item.cl);

          return `
            <tr>
              <td>${safeText(item.row.panel)}</td>
              <td>${safeText(item.row.heading)}</td>
              <td>${item.row.chainage ?? ""}</td>
              <td>${Number(item.tonnage).toFixed(1)}</td>
              <td><span class="grade-value ${k2oClass}">${formatPercent(item.k2o, 1)}</span></td>
              <td><span class="grade-value">${formatPercent(item.halite, 1)}</span></td>
              <td><span class="grade-value ${clClass}">${formatPercent(item.cl, 1)}</span></td>
              <td>${normaliseDomainSummary(item.row.domain_summary)
                .map(d => `${d.domainName} ${Number(d.percent).toFixed(1)}%`)
                .join("<br>")}</td>
              <td>
                <button onclick="removePlanRow('${item.facePhotoID}')" class="toggle-btn">Remove</button>
              </td>
            </tr>
          `;
        }).join("")}
      </tbody>
    </table>
  `;

  const totalTonnes = miningPlan.reduce((sum, x) => sum + Number(x.tonnage || 0), 0);

  const weightedK2OSum = miningPlan.reduce(
    (sum, x) => sum + (Number(x.tonnage || 0) * Number(x.k2o || 0)),
    0
  );

  const weightedHaliteSum = miningPlan.reduce(
    (sum, x) => sum + (Number(x.tonnage || 0) * Number(x.halite || 0)),
    0
  );

  const weightedClSum = miningPlan.reduce(
    (sum, x) => sum + (Number(x.tonnage || 0) * Number(x.cl || 0)),
    0
  );

  const weightedK2O = totalTonnes > 0 ? weightedK2OSum / totalTonnes : 0;
  const weightedHalite = totalTonnes > 0 ? weightedHaliteSum / totalTonnes : 0;
  const weightedCl = totalTonnes > 0 ? weightedClSum / totalTonnes : 0;

  const weightedK2OClass = getK2OClass(weightedK2O);
  const weightedClClass = getClClass(weightedCl);

  document.getElementById("planTotalTonnes").textContent =
    `Total tonnes: ${totalTonnes.toFixed(1)}`;

  document.getElementById("planWeightedK2O").innerHTML =
    `Weighted K2O: <span class="grade-value ${weightedK2OClass}">${weightedK2O.toFixed(1)}%</span>`;

  document.getElementById("planWeightedHalite").innerHTML =
    `Weighted Halite: <span class="grade-value">${weightedHalite.toFixed(1)}%</span>`;

  document.getElementById("planWeightedCl").innerHTML =
    `Weighted Cl: <span class="grade-value ${weightedClClass}">${weightedCl.toFixed(1)}%</span>`;
}


//listeners
document.getElementById("refreshBtn").addEventListener("click", loadDashboard);
document.getElementById("searchInput").addEventListener("input", applyFiltersAndRender);
document.getElementById("sortSelect").addEventListener("change", applyFiltersAndRender);
document.getElementById("mapFilterSelect").addEventListener("change", applyFiltersAndRender);
document.getElementById("addPlanBtn").addEventListener("click", addPlanRow);
document.getElementById("closeModalBtn").addEventListener("click", closeModal);
document.getElementById("modal").addEventListener("click", (e) => {
  if (e.target.id === "modal") closeModal();
});


const modalImgEl = document.getElementById("modal-img");

modalImgEl.addEventListener("dblclick", (e) => {
  e.preventDefault();
  toggleModalZoom();
});

modalImgEl.addEventListener("mousedown", (e) => {
  if (modalZoom <= 1) return;
  e.preventDefault();
  modalDragging = true;
  modalDragStartX = e.clientX - modalPanX;
  modalDragStartY = e.clientY - modalPanY;
  applyModalTransform();
});

window.addEventListener("mousemove", (e) => {
  if (!modalDragging) return;
  modalPanX = e.clientX - modalDragStartX;
  modalPanY = e.clientY - modalDragStartY;
  applyModalTransform();
});

window.addEventListener("mouseup", () => {
  if (!modalDragging) return;
  modalDragging = false;
  applyModalTransform();
});

modalImgEl.addEventListener("touchstart", (e) => {
  if (modalZoom <= 1) return;
  const touch = e.touches[0];
  modalDragging = true;
  modalDragStartX = touch.clientX - modalPanX;
  modalDragStartY = touch.clientY - modalPanY;
}, { passive: true });

modalImgEl.addEventListener("touchmove", (e) => {
  if (!modalDragging) return;
  const touch = e.touches[0];
  modalPanX = touch.clientX - modalDragStartX;
  modalPanY = touch.clientY - modalDragStartY;
  applyModalTransform();
}, { passive: true });

modalImgEl.addEventListener("touchend", () => {
  modalDragging = false;
  applyModalTransform();
});

document.addEventListener("DOMContentLoaded", loadDashboard);
// setInterval(loadDashboard, 60000);
</script>
